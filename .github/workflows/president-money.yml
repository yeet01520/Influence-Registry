name: Refresh Presidential Money

# Builds data/president.json: inaugural committee donations and independent
# expenditures for the president.
#
# WHY THESE TWO AND NOT PAC SHARE:
# presidential committees may accept only $5,000 per PAC per election, so PAC
# share is near zero for any president by law and is not comparable to a member
# of Congress. The money that matters sits outside the candidate committee:
# inaugural donations (no limits, corporations may give directly, itemised at
# $200+) and super PAC independent expenditures.
#
# NOT COVERED: OGE Form 278e financial disclosure. Those are PDFs with no API
# and no machine-readable feed, so they belong in a hand-curated file with a
# link to each source document rather than in a scraper.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 1 * *'    # monthly; inaugural filings are amended for months

jobs:
  president-money:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch presidential money
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python3 scripts/fetch_president.py

      - name: Commit updated data
        if: ${{ always() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/president.json
          echo "--- staged ---"
          git status --short
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh presidential inaugural donations and outside spending"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
